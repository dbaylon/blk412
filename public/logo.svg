<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C97850;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Coffee cup steam -->
  <path d="M100 45 Q95 35 100 30 Q105 35 100 40 Q95 45 100 50" 
        stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" 
        fill="none" opacity="0.8"/>
  <path d="M110 45 Q105 35 110 30 Q115 35 110 40 Q105 45 110 50" 
        stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" 
        fill="none" opacity="0.6"/>
  <path d="M90 45 Q85 35 90 30 Q95 35 90 40 Q85 45 90 50" 
        stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" 
        fill="none" opacity="0.6"/>
  
  <!-- Coffee/Tea cup -->
  <path d="M70 60 L75 110 Q75 120 85 120 L115 120 Q125 120 125 110 L130 60 Z" 
        fill="#F5E6D3" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Cup handle -->
  <path d="M130 75 Q145 75 145 90 Q145 105 130 105" 
        stroke="url(#accentGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Tea leaf accent -->
  <ellipse cx="100" cy="85" rx="15" ry="8" fill="url(#accentGradient)" opacity="0.7"/>
  <path d="M100 77 Q100 85 100 93" stroke="#2C1810" stroke-width="1.5"/>
  
  <!-- BLK text -->
  <text x="100" y="150" font-family="serif" font-size="32" font-weight="700" 
        fill="#F5E6D3" text-anchor="middle" letter-spacing="-1">BLK</text>
  
  <!-- 412 text -->
  <text x="100" y="175" font-family="serif" font-size="28" font-weight="600" 
        fill="url(#accentGradient)" text-anchor="middle" letter-spacing="2">412</text>
  
  <!-- Decorative border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#accentGradient)" 
          stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#F5E6D3" 
          stroke-width="1" opacity="0.3"/>
</svg>