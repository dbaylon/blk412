<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Centered circle with black background -->
  <circle cx="100" cy="100" r="88" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- BLK text - top, perfectly centered -->
  <text x="100" y="75" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="6">BLK</text>
  
  <!-- Horizontal divider line -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- 412 text - bottom, perfectly centered -->
  <text x="100" y="125" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="6">412</text>
  
  <!-- Coffee & Tea subtitle - centered at bottom -->
  <text x="100" y="155" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="11" 
        font-weight="400" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="4">COFFEE &amp; TEA</text>
</svg>
